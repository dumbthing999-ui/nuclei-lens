name: Scientific core and browser checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e '.[dev]' -c requirements.lock
      - run: python scripts/check_release.py
      - name: Verify complete additional-assessment records
        if: ${{ hashFiles('evaluation/additional/summary.json') != '' }}
        run: python scripts/check_additional.py
      - run: pytest
      - run: ruff check src tests scripts
      - name: Python security AST checks in isolated tools environment
        run: |
          python -m venv /tmp/nucleilens-security-tools
          /tmp/nucleilens-security-tools/bin/pip install -r security-tools.lock
          /tmp/nucleilens-security-tools/bin/bandit -r src -f json -o evaluation/checks/bandit-ci.json
      - run: pip-audit --strict --no-deps -r requirements.lock
      - run: pip-audit --strict --no-deps -r security-tools.lock
      - name: Audit optional neural pins without installing neural frameworks
        run: |
          python - <<'PY'
          from pathlib import Path
          # Advisory databases identify upstream Torch, not its CPU wheel suffix.
          lines = Path('requirements.models.lock').read_text().splitlines()
          normalized = [line.split('+', 1)[0] if line.startswith('torch==') else line for line in lines]
          Path('/tmp/nucleilens-model-audit.txt').write_text('\n'.join(normalized) + '\n')
          PY
          pip-audit --disable-pip --strict --no-deps -r /tmp/nucleilens-model-audit.txt
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=moderate
      - run: npm test --prefix frontend
      - run: node scripts/sync_engine.mjs
      - run: node scripts/prepare_runtime.mjs
      - run: python scripts/collect_notices.py
      - run: npm run build --prefix frontend
      - name: Verify Sites static package input
        run: node scripts/copy_site_dist.mjs && test -f dist/index.html
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Real browser workflow and on-device inference
        run: |
          npm run preview --prefix frontend -- --port 5173 > /tmp/nucleilens-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
          node frontend/tests/browser-smoke.mjs
          node frontend/tests/accessibility.mjs
          node frontend/tests/mask-qa-smoke.mjs
          node frontend/tests/focus-motion.mjs
          node frontend/tests/keyboard-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-evidence
          path: |
            artifacts/ci-screenshots/
            artifacts/keyboard-smoke-ci/
            evaluation/checks/browser-smoke-ci.json
            evaluation/checks/accessibility-ci.json
            evaluation/checks/bandit-ci.json
            evaluation/checks/mask-qa-browser.json
            evaluation/checks/focus-motion-ci.json
            evaluation/checks/keyboard-smoke-ci.json
