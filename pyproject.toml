[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclei-lens"
version = "0.1.0"
description = "Inspectable nuclei-count disagreement and human review"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.18.0",
  "scikit-image==0.26.0",
  "pillow==12.3.0",
  "fastapi==0.142.3",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10", "pip-audit==2.10.1", "matplotlib==3.11.2"]

[project.scripts]
nuclei-lens = "nuclei_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
